<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | VisualNotes</title>
    <meta name="description" content="Page not found. Return to VisualNotes home page to explore free handwritten engineering guides on infrastructure, cloud, and security.">
    <link rel="canonical" href="https://www.visualnotes.tech/404.html">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MHPEMGRWXH"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-MHPEMGRWXH', {
            'anonymize_ip': true,
            'cookie_flags': 'SameSite=None;Secure'
        });
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #F4F5F9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1D1C20;
            overflow: hidden;
            position: relative;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* FUTURE CYBER GRID OVERLAY */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 50%, rgba(54, 95, 240, 0.02) 0%, transparent 50%),
                linear-gradient(90deg, rgba(29, 28, 32, 0.02) 1px, transparent 1px),
                linear-gradient(rgba(29, 28, 32, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 60px 60px, 60px 60px;
            pointer-events: none;
            z-index: 1;
        }

        /* GLOWING AMBIENT LIGHTS */
        .ambient-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(54, 95, 240, 0.06) 0%, transparent 70%);
            top: 20%;
            left: 10%;
            pointer-events: none;
            filter: blur(40px);
            z-index: 0;
        }

        .ambient-glow.teal {
            background: radial-gradient(circle, rgba(216, 86, 222, 0.06) 0%, transparent 70%);
            bottom: 10%;
            right: 10%;
            top: auto;
            left: auto;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 580px;
            width: 90%;
            padding: 50px 40px;
            border-radius: 24px;
            background: #FFFFFF;
            border: 1px solid #E2E4EC;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            transition: all 0.3s ease;
        }

        .error-code {
            font-family: 'Share Tech Mono', monospace;
            font-size: 8.5rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #365FF0 0%, #D856DE 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 40px rgba(54, 95, 240, 0.15);
            animation: pulseGlow 3s infinite ease-in-out;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: #1D1C20;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 1.1rem;
            color: #575965;
            line-height: 1.6;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 36px;
            background: #365FF0;
            color: #ffffff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px rgba(54, 95, 240, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(54, 95, 240, 0.35);
            background: #2445C5;
        }

        .links {
            margin-top: 45px;
            padding-top: 30px;
            border-top: 1px solid #E2E4EC;
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .links a {
            color: #575965;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .links a:hover {
            color: #365FF0;
            text-decoration: none;
        }

        /* DARK MODE OVERRIDES */
        body.dark-mode {
            background: radial-gradient(circle at 10% 20%, #0f172a 0%, #090d16 90%);
            color: #f8fafc;
        }

        body.dark-mode::before {
            background: 
                radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.05) 0%, transparent 50%),
                linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px);
        }

        body.dark-mode .ambient-glow {
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
        }

        body.dark-mode .ambient-glow.teal {
            background: radial-gradient(circle, rgba(0, 200, 160, 0.08) 0%, transparent 70%);
        }

        body.dark-mode .container {
            background: rgba(15, 23, 42, 0.45);
            border-color: rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .error-code {
            background: linear-gradient(135deg, #6366f1 0%, #00c8a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 40px rgba(99, 102, 241, 0.15);
        }

        body.dark-mode h1 {
            color: #ffffff;
        }

        body.dark-mode p {
            color: #94a3b8;
        }

        body.dark-mode .btn {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        body.dark-mode .btn:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.45);
        }

        body.dark-mode .links {
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        body.dark-mode .links a {
            color: #94a3b8;
        }

        body.dark-mode .links a:hover {
            color: #00c8a0;
        }

        /* Floating Theme Toggle Button */
        #theme-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1D1C20;
            color: #F4F5F9;
            border: 1px solid #E2E4EC;
            padding: 10px 20px;
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            z-index: 998;
            transition: all 0.25s ease;
        }

        #theme-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        body.dark-mode #theme-toggle {
            background: #FFFFFF;
            color: #1D1C20;
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* ANIMATIONS */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseGlow {
            0%, 100% {
                filter: drop-shadow(0 0 5px rgba(99, 102, 241, 0.1));
            }
            50% {
                filter: drop-shadow(0 0 20px rgba(0, 200, 160, 0.3));
            }
        }
    </style>
</head>

<body>
    <script>(function(){if(localStorage.getItem('darkMode')==='true'){document.body.classList.add('dark-mode');}})();</script>
    <div class="ambient-glow"></div>
    <div class="ambient-glow teal"></div>

    <div class="container">
        <div class="error-code">404</div>
        <h1>Lost in the Cyber Grid</h1>
        <p>The page index you requested cannot be located inside our directory database.<br>It might have been shifted, renamed, or encrypted.</p>

        <a href="/" class="btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Return to Core Home
        </a>

        <div class="links">
            <a href="guides/index.html">
                <span>📚</span> Study Guides
            </a>
            <a href="blog/index.html">
                <span>📰</span> The Journal
            </a>
            <a href="index.html#subscribe">
                <span>🔔</span> Subscribe
            </a>
        </div>
    </div>

    <!-- Floating Theme Toggle Button -->
    <button id="theme-toggle" onclick="toggleDarkMode()">
        🌙 DARK MODE
    </button>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Restore theme preference
            const savedTheme = localStorage.getItem('darkMode');
            if (savedTheme === 'true') {
                document.body.classList.add('dark-mode');
            }
            updateThemeButtonText();
        });

        // ===== DARK MODE TOGGLE =====
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark ? 'true' : 'false');
            updateThemeButtonText();
        }

        function updateThemeButtonText() {
            const btn = document.getElementById('theme-toggle');
            if (!btn) return;
            const isDark = document.body.classList.contains('dark-mode');
            btn.innerHTML = isDark ? '☀ LIGHT MODE' : '🌙 DARK MODE';
        }
    </script>
</body>

</html>
