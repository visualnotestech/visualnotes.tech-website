<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | VisualNotes</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at 10% 20%, #0f172a 0%, #090d16 90%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            overflow: hidden;
            position: relative;
        }

        /* FUTURE CYBER GRID OVERLAY */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.05) 0%, transparent 50%),
                linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: 100% 100%, 60px 60px, 60px 60px;
            pointer-events: none;
            z-index: 1;
        }

        /* GLOWING AMBIENT LIGHTS */
        .ambient-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
            top: 20%;
            left: 10%;
            pointer-events: none;
            filter: blur(40px);
            z-index: 0;
        }

        .ambient-glow.teal {
            background: radial-gradient(circle, rgba(0, 200, 160, 0.08) 0%, transparent 70%);
            bottom: 10%;
            right: 10%;
            top: auto;
            left: auto;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 580px;
            width: 90%;
            padding: 50px 40px;
            border-radius: 24px;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .error-code {
            font-family: 'Share Tech Mono', monospace;
            font-size: 8.5rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #6366f1 0%, #00c8a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 40px rgba(99, 102, 241, 0.15);
            animation: pulseGlow 3s infinite ease-in-out;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 1.1rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 36px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.45);
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
        }

        .links {
            margin-top: 45px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .links a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .links a:hover {
            color: #00c8a0;
            text-decoration: none;
        }

        /* ANIMATIONS */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseGlow {
            0%, 100% {
                filter: drop-shadow(0 0 5px rgba(99, 102, 241, 0.1));
            }
            50% {
                filter: drop-shadow(0 0 20px rgba(0, 200, 160, 0.3));
            }
        }
    </style>
</head>

<body>
    <div class="ambient-glow"></div>
    <div class="ambient-glow teal"></div>

    <div class="container">
        <div class="error-code">404</div>
        <h1>Lost in the Cyber Grid</h1>
        <p>The page index you requested cannot be located inside our directory database.<br>It might have been shifted, renamed, or encrypted.</p>

        <a href="/" class="btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Return to Core Home
        </a>

        <div class="links">
            <a href="/#guides">
                <span>📚</span> Study Guides
            </a>
            <a href="/blog/index.html">
                <span>📰</span> The Journal
            </a>
            <a href="/#subscribe">
                <span>🔔</span> Subscribe
            </a>
        </div>
    </div>
</body>

</html>
