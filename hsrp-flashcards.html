        /* Standalone scoped CSS re-using global theme colors without affecting global namespace */
        :root {
            --primary: var(--vn-coral);

        * {

            padding: 0;
            -webkit-tap-highlight-color: transparent;

        body {
            font-family: var(--vn-font-body);
            background: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Main Content Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 110px 20px 40px; /* adjusted top padding to prevent sticky header overlap */

            margin: 0 auto;
            min-height: calc(100vh - 72px);

        .category-label {
            font-family: var(--vn-font-display);
            background: rgba(255, 107, 107, 0.1);
            color: var(--primary);
            padding: 8px 18px;

        /* Flashcard Container Setup */
        .flashcard-container {
            width: 100%;
            height: 400px;
            max-height: 50vh;
            perspective: 2000px;
            /* Enhanced 3D depth */
            margin-bottom: 30px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* Bouncy flip effect */
            transform-style: preserve-3d;
            cursor: pointer;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
            /* Softer shadow */
            border-radius: 24px;
        }

        .flashcard:hover {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
            transform: translateY(-5px);
            /* Lift on hover */
        }

        .flashcard.is-flipped:hover {
            transform: rotateY(180deg) translateY(-5px);
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        /* Shared Card Faces */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            /* Safari fallback */
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
            background: var(--bg-white);
            border: 2px solid transparent;
            overflow: hidden;
        }

        /* Front Face (Question) */
        .card-front {
            color: var(--text-dark);
            border-top: 6px solid var(--secondary);
            /* Brand matching accent */
        }

        .card-front::before {
            content: 'QUESTION';
            position: absolute;
            top: 24px;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--secondary);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-family: 'Share Tech Mono', monospace;
        }

        /* Back Face (Answer) */
        .card-back {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            transform: rotateY(180deg);
            border: none;
        }

        .card-back::before {
            content: 'ANSWER';
            position: absolute;
            top: 24px;
            font-size: 0.8rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-family: 'Share Tech Mono', monospace;

        .card-content {

            font-size: clamp(1.15rem, 3.8vw, 1.7rem);

        <div class="flashcard-container" id="flashcardContainer">

        <noscript>
            <div class="noscript-flashcards" style="width: 100%; max-width: 600px; margin: 20px auto; padding: 20px; background: var(--vn-bg-white); border: 1px solid var(--vn-border); border-radius: 12px; text-align: left;">
                <h2 style="font-family: var(--vn-font-display); color: var(--vn-accent); margin-bottom: 15px; font-size: 1.25rem;">HSRP Flashcards Study List</h2>
                <ul style="list-style: none; padding-left: 0;">
                    <li style="margin-bottom: 15px; border-bottom: 1px dashed var(--vn-border); padding-bottom: 10px;">
                        <strong>Q: What is the primary objective of the Hot Standby Router Protocol (HSRP)?</strong><br>
                        <span style="color: var(--vn-ink-secondary);">A: To provide network redundancy for IP networks by ensuring transparent recovery from first-hop failures.</span>
                    </li>
                    <li style="margin-bottom: 15px; border-bottom: 1px dashed var(--vn-border); padding-bottom: 10px;">
                        <strong>Q: How do routers participating in HSRP appear to hosts on a local area network?</strong><br>
                        <span style="color: var(--vn-ink-secondary);">A: They appear as a single virtual router sharing a single IP and MAC address.</span>
                    </li>
                    <li style="margin-bottom: 15px; border-bottom: 1px dashed var(--vn-border); padding-bottom: 10px;">
                        <strong>Q: What is the limitation of using Proxy ARP for router redundancy if a router fails?</strong><br>
                        <span style="color: var(--vn-ink-secondary);">A: The host continues sending packets to the failed router's MAC address until the ARP entry times out or the host reboots.</span>
                    </li>
                    <li style="margin-bottom: 15px; border-bottom: 1px dashed var(--vn-border); padding-bottom: 10px;">
                        <strong>Q: Why is running dynamic routing protocols like RIP on every host often impractical?</strong><br>
                        <span style="color: var(--vn-ink-secondary);">A: It involves high administrative and processing overhead, security issues, and lack of protocol support on all platforms.</span>
                    </li>
                    <li style="margin-bottom: 15px; border-bottom: 1px dashed var(--vn-border); padding-bottom: 10px;">
                        <strong>Q: What is the main drawback of using RIP for host-level router discovery?</strong><br>
                        <span style="color: var(--vn-ink-secondary);">A: It is slow to adapt to changes in the network topology.</span>
                    </li>
                    <li style="margin-bottom: 15px; border-bottom: 1px dashed var(--vn-border); padding-bottom: 10px;">
                        <strong>Q: In ICMP Router Discovery Protocol (IRDP), how does a host detect that its configured router is unavailable?</strong><br>
                        <span style="color: var(--vn-ink-secondary);">A: The host stops receiving periodic hello multicast messages from the router.</span>
                    </li>
                    <li style="margin-bottom: 15px; border-bottom: 1px dashed var(--vn-border); padding-bottom: 10px;">
                        <strong>Q: Why is the default IRDP configuration unsuitable for rapid first-hop failure detection?</strong><br>
                        <span style="color: var(--vn-ink-secondary);">A: The default advertisement rate is only every 7 to 10 minutes, with a 30-minute lifetime.</span>
                    </li>
                    <li style="margin-bottom: 15px; border-bottom: 1px dashed var(--vn-border); padding-bottom: 10px;">
                        <strong>Q: What is the limitation of DHCP regarding router redundancy?</strong><br>
                        <span style="color: var(--vn-ink-secondary);">A: DHCP provides a default gateway but lacks a mechanism to switch to an alternative if that gateway fails.</span>
                    </li>
                    <li style="margin-bottom: 15px; border-bottom: 1px dashed var(--vn-border); padding-bottom: 10px;">
                        <strong>Q: In an HSRP group, what is the role of the 'Active' router?</strong><br>
                        <span style="color: var(--vn-ink-secondary);">A: It is responsible for forwarding packets sent by hosts to the virtual router.</span>
                    </li>
                    <li style="margin-bottom: 15px; border-bottom: 1px dashed var(--vn-border); padding-bottom: 10px;">
                        <strong>Q: What happens to the 'Standby' router if the 'Active' router fails?</strong><br>
                        <span style="color: var(--vn-ink-secondary);">A: The Standby router assumes the packet-forwarding duties of the Active router.</span>
                    </li>
                </ul>
            </div>

    <!-- Source Data Script Loading (Kept separate for easy modifications) -->
    <script src="js/hsrp-flashcards-data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let currentIndex = 0;

            const card = document.getElementById('activeCard');
            const container = document.getElementById('flashcardContainer');
            const questionEl = document.getElementById('cardQuestion');
            const answerEl = document.getElementById('cardAnswer');
            const currentIdxEl = document.getElementById('currentIndex');
            const totalCardsEl = document.getElementById('totalCards');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            function initialize() {
                // Handle no data safely
                if (typeof flashcardData === 'undefined' || flashcardData.length === 0) {
                    questionEl.innerText = "No Flashcards Found!";
                    answerEl.innerText = "Please update js/hsrp-flashcards-data.js with your data rows.";
                    return;
                }

                totalCardsEl.innerText = flashcardData.length;
                updateCardView();
                bindEvents();
            }

            function bindEvents() {
                // Card Flip
                container.addEventListener('click', () => {
                    card.classList.toggle('is-flipped');
                });

                // Next/Prev Buttons
                prevBtn.addEventListener('click', (e) => {
                    e.stopPropagation(); // Avoid triggering card flip
                    if (currentIndex > 0) {
                        currentIndex--;
                        updateCardView();
                    }
                });

                nextBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (currentIndex < flashcardData.length - 1) {
                        currentIndex++;
                        updateCardView();
                    }
                });

                // Keyboard Accessibility for Desktop
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowRight' || e.key === ' ') {
                        if (currentIndex < flashcardData.length - 1) {
                            currentIndex++;
                            updateCardView();
                        }
                    } else if (e.key === 'ArrowLeft') {
                        if (currentIndex > 0) {
                            currentIndex--;
                            updateCardView();
                        }
                    } else if (e.key === 'Enter' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                        card.classList.toggle('is-flipped');
                    }
                });
            }

            function updateCardView() {
                // Always show the front before changing text
                if (card.classList.contains('is-flipped')) {
                    card.classList.remove('is-flipped');
                    // Timeout allows flip animation to finish before swapping text
                    setTimeout(() => fillCardContent(), 300);
                } else {
                    fillCardContent();
                }
            }

            function fillCardContent() {
                const currentData = flashcardData[currentIndex];
                questionEl.innerText = currentData.question;
                answerEl.innerText = currentData.answer;
                currentIdxEl.innerText = currentIndex + 1;

                // Update nav constraints
                prevBtn.disabled = currentIndex === 0;
                nextBtn.disabled = currentIndex === flashcardData.length - 1;
            }

            // Restore theme preference
            const savedTheme = localStorage.getItem('darkMode');
            if (savedTheme === 'true') {
                document.body.classList.add('dark-mode');
            }
            updateThemeButtonText();

            initialize();
        });

        // ===== HEADER SCROLL BEHAVIOR =====
        const header = document.getElementById('vnHeader');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 60) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        // ===== MOBILE NAV =====
        const hamburger = document.getElementById('vnHamburger');
        const mobileNav = document.getElementById('vnMobileNav');

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            mobileNav.classList.toggle('active');
            document.body.style.overflow = mobileNav.classList.contains('active') ? 'hidden' : '';
        });

        function closeMobileNav() {
            hamburger.classList.remove('active');
            mobileNav.classList.remove('active');
            document.body.style.overflow = '';
        }

        // ===== DARK MODE TOGGLE =====
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark ? 'true' : 'false');
            updateThemeButtonText();
        }

        function updateThemeButtonText() {
            const btn = document.getElementById('theme-toggle');
            if (!btn) return;
            const isDark = document.body.classList.contains('dark-mode');
            btn.innerHTML = isDark ? '☀ LIGHT MODE' : '🌙 DARK MODE';
        }
    </script>

    <!-- Floating Theme Toggle Button -->
