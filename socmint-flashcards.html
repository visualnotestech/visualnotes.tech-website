    <style>
        /* Scoped styles mapped to design system variables for dynamic theme support */
        :root {
            --primary: var(--vn-coral);
            --accent: var(--vn-accent);
            --accent-dark: var(--vn-accent-hover);
            --text-dark: var(--vn-ink);
            --text-light: var(--vn-ink-secondary);
            --bg-dark: var(--vn-bg);
            --bg-card: var(--vn-bg-white);
            --border-color: var(--vn-border);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--vn-font-body);
            background: var(--bg-dark);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Main Content Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 110px 20px 40px; /* adjusted top padding to prevent sticky header overlap */
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            min-height: calc(100vh - 72px);
        }

        .category-label {
            background: var(--vn-accent-subtle);
            color: var(--accent);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Share Tech Mono', monospace;
            border: 1px solid var(--border-color);
        }

        /* Flashcard Container Setup */
        .flashcard-container {
            width: 100%;
            height: 400px;
            max-height: 50vh;
            perspective: 2000px;
            margin-bottom: 30px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            cursor: pointer;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.05);
            border-radius: 24px;
        }

        .flashcard:hover {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
            transform: translateY(-5px);
        }

        .flashcard.is-flipped:hover {
            transform: rotateY(180deg) translateY(-5px);
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        /* Shared Card Faces */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        /* Front Face (Question) */
        .card-front {
            color: var(--text-dark);
            border-top: 6px solid var(--accent);
        }

        .card-front::before {
            content: 'QUESTION';
            position: absolute;
            top: 24px;
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-family: 'Share Tech Mono', monospace;
        }

        /* Back Face (Answer) */
        .card-back {
            background: linear-gradient(135deg, var(--accent-dark) 0%, var(--accent) 100%);
            color: white;
            transform: rotateY(180deg);
            border: none;
        }

        .card-back::before {
            content: 'ANSWER';
            position: absolute;
            top: 24px;
            font-size: 0.85rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-family: 'Share Tech Mono', monospace;
        }

        .card-content {
            font-family: var(--vn-font-body), sans-serif;
            font-size: clamp(1.15rem, 3.8vw, 1.65rem);
            font-weight: 500;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Bottom Controls */
        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-color);
        }

        .btn-control {
            background: none;
            border: none;
            color: var(--text-dark);
            cursor: pointer;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .btn-control:hover {
            background: var(--border-color);
            color: var(--accent);
        }

        .btn-control:disabled {
            color: #475569;
            cursor: not-allowed;
            background: none;
        }

        .progress-text {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-light);
            font-family: 'Share Tech Mono', monospace;
        }

        .progress-text span {
            color: var(--accent);
        }

        .hint {
            margin-top: 24px;
            font-size: 0.95rem;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 480px) {
            header {
                padding: 15px 20px;
            }

            .flashcard-container {
                height: 350px;
            }

            .card-content {
                font-size: 1.2rem;
            }

            .card-face {
                padding: 30px 15px;
            }
        }
    </style>

        <h1 class="category-label">SOCMINT Training</h1>

        <div class="flashcard-container" id="flashcardContainer">
            <div class="flashcard" id="activeCard">
                <div class="card-face card-front">

        <noscript>
            <div class="noscript-flashcards" style="width: 100%; max-width: 600px; margin: 20px auto; padding: 20px; background: var(--vn-bg-white); border: 1px solid var(--vn-border); border-radius: 12px; text-align: left;">
                <h2 style="font-family: var(--vn-font-display); color: var(--vn-accent); margin-bottom: 15px; font-size: 1.25rem;">SOCMINT Flashcards Study List</h2>
                <ul style="list-style: none; padding-left: 0;">
                    <li style="margin-bottom: 15px; border-bottom: 1px dashed var(--vn-border); padding-bottom: 10px;">
                        <strong>Q: What is the primary definition of Advanced Social Media Intelligence (SOCMINT)?</strong><br>
                        <span style="color: var(--vn-ink-secondary);">A: The combination of traditional investigative techniques with sophisticated analytical methodologies to extract actionable intelligence from social platforms.</span>
                    </li>
                    <li style="margin-bottom: 15px; border-bottom: 1px dashed var(--vn-border); padding-bottom: 10px;">
                        <strong>Q: In Social Network Analysis (SNA), what is measured by 'Degree Centrality'?</strong><br>
                        <span style="color: var(--vn-ink-secondary);">A: The number of direct connections an account has, identifying popular actors.</span>
                    </li>
                    <li style="margin-bottom: 15px; border-bottom: 1px dashed var(--vn-border); padding-bottom: 10px;">
                        <strong>Q: Which centrality measure identifies 'information brokers' who control the flow of data between different groups?</strong><br>
                        <span style="color: var(--vn-ink-secondary);">A: Betweenness Centrality.</span>
                    </li>
                    <li style="margin-bottom: 15px; border-bottom: 1px dashed var(--vn-border); padding-bottom: 10px;">
                        <strong>Q: How does 'Eigenvector Centrality' determine the influence of a social media account?</strong><br>
                        <span style="color: var(--vn-ink-secondary);">A: It calculates influence based on the influence levels of the account's connections.</span>
                    </li>
                    <li style="margin-bottom: 15px; border-bottom: 1px dashed var(--vn-border); padding-bottom: 10px;">
                        <strong>Q: Which measure is best for identifying actors who can reach others in a network with the least number of steps?</strong><br>
                        <span style="color: var(--vn-ink-secondary);">A: Closeness Centrality.</span>
                    </li>
                    <li style="margin-bottom: 15px; border-bottom: 1px dashed var(--vn-border); padding-bottom: 10px;">
                        <strong>Q: The Girvan-Newman algorithm identifies cohesive subgroups through hierarchical clustering based on edge betweenness.</strong><br>
                        <span style="color: var(--vn-ink-secondary);">A: True.</span>
                    </li>
                    <li style="margin-bottom: 15px; border-bottom: 1px dashed var(--vn-border); padding-bottom: 10px;">
                        <strong>Q: What is the primary objective of the Louvain Method in network analysis?</strong><br>
                        <span style="color: var(--vn-ink-secondary);">A: To find community structure by optimising modularity within the network.</span>
                    </li>
                    <li style="margin-bottom: 15px; border-bottom: 1px dashed var(--vn-border); padding-bottom: 10px;">
                        <strong>Q: Which community detection method is known for being a fast algorithm suitable for large-scale networks?</strong><br>
                        <span style="color: var(--vn-ink-secondary);">A: Label Propagation.</span>
                    </li>
                    <li style="margin-bottom: 15px; border-bottom: 1px dashed var(--vn-border); padding-bottom: 10px;">
                        <strong>Q: Spectral Clustering uses the eigenvalues of similarity matrices to group actors into communities.</strong><br>
                        <span style="color: var(--vn-ink-secondary);">A: True.</span>
                    </li>
                    <li style="margin-bottom: 15px; border-bottom: 1px dashed var(--vn-border); padding-bottom: 10px;">
                        <strong>Q: Name an open-source platform commonly used for network analysis and visualisation.</strong><br>
                        <span style="color: var(--vn-ink-secondary);">A: Gephi.</span>
                    </li>
                </ul>

    <!-- Source Data Script Loading -->
    <script src="js/socmint-flashcards-data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let currentIndex = 0;

            const card = document.getElementById('activeCard');
            const container = document.getElementById('flashcardContainer');
            const questionEl = document.getElementById('cardQuestion');
            const answerEl = document.getElementById('cardAnswer');
            const currentIdxEl = document.getElementById('currentIndex');
            const totalCardsEl = document.getElementById('totalCards');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            function initialize() {
                if (typeof flashcardData === 'undefined' || flashcardData.length === 0) {
                    questionEl.innerText = "No Flashcards Found!";
                    answerEl.innerText = "Please update js/socmint-flashcards-data.js with your data rows.";
                    return;
                }

                totalCardsEl.innerText = flashcardData.length;
                updateCardView();
                bindEvents();
            }

            function bindEvents() {
                // Card Flip
                container.addEventListener('click', () => {
                    card.classList.toggle('is-flipped');
                });

                // Next/Prev Buttons
                prevBtn.addEventListener('click', (e) => {
                    e.stopPropagation(); // Avoid triggering card flip
                    if (currentIndex > 0) {
                        currentIndex--;
                        updateCardView();
                    }
                });

                nextBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (currentIndex < flashcardData.length - 1) {
                        currentIndex++;
                        updateCardView();
                    }
                });

                // Keyboard Accessibility for Desktop
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowRight' || e.key === ' ') {
                        if (currentIndex < flashcardData.length - 1) {
                            currentIndex++;
                            updateCardView();
                        }
                    } else if (e.key === 'ArrowLeft') {
                        if (currentIndex > 0) {
                            currentIndex--;
                            updateCardView();
                        }
                    } else if (e.key === 'Enter' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                        card.classList.toggle('is-flipped');
                    }
                });
            }

            function updateCardView() {
                if (card.classList.contains('is-flipped')) {
                    card.classList.remove('is-flipped');
                    setTimeout(() => fillCardContent(), 300);
                } else {
                    fillCardContent();
                }
            }

            function fillCardContent() {
                const currentData = flashcardData[currentIndex];
                questionEl.innerText = currentData.question;
                answerEl.innerText = currentData.answer;
                currentIdxEl.innerText = currentIndex + 1;

                prevBtn.disabled = currentIndex === 0;
                nextBtn.disabled = currentIndex === flashcardData.length - 1;
            }

            // Restore theme preference
            const savedTheme = localStorage.getItem('darkMode');
            if (savedTheme === 'true') {
                document.body.classList.add('dark-mode');
            }
            updateThemeButtonText();

            initialize();
        });

        // ===== HEADER SCROLL BEHAVIOR =====
        const header = document.getElementById('vnHeader');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 60) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        // ===== MOBILE NAV =====
        const hamburger = document.getElementById('vnHamburger');
        const mobileNav = document.getElementById('vnMobileNav');

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            mobileNav.classList.toggle('active');
            document.body.style.overflow = mobileNav.classList.contains('active') ? 'hidden' : '';
        });

        function closeMobileNav() {
            hamburger.classList.remove('active');
            mobileNav.classList.remove('active');
            document.body.style.overflow = '';
        }

        // ===== DARK MODE TOGGLE =====
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark ? 'true' : 'false');
            updateThemeButtonText();
        }

        function updateThemeButtonText() {
            const btn = document.getElementById('theme-toggle');
            if (!btn) return;
            const isDark = document.body.classList.contains('dark-mode');
            btn.innerHTML = isDark ? '☀ LIGHT MODE' : '🌙 DARK MODE';
        }
    </script>

    <!-- Floating Theme Toggle Button -->
    <button id="theme-toggle" onclick="toggleDarkMode()">
        🌙 DARK MODE
    </button>
