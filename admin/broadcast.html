<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualNotes - Admin Broadcast Dashboard</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #FF6B6B;
            --accent-gradient: linear-gradient(135deg, #FF6B6B 0%, #4ECDC4 100%);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 30px 20px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #0b1120;
            color: white;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #4ECDC4;
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .helper {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>📢 Broadcast Newsletter</h1>
        <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 25px;">
            Send an update to all active subscribers via Google Apps Script.
        </p>

        <!-- Credentials -->
        <div class="form-group">
            <label>Admin Key</label>
            <input type="password" id="adminKey" placeholder="Enter your secret admin key" required>
            <div class="helper">Set this up in Apps Script using scriptProperties.</div>
        </div>

        <div class="form-group">
            <label>Script Web App URL</label>
            <input type="url" id="scriptUrl" value="https://script.google.com/macros/s/AKfycbwYxzHdMiTy0Q8O-dURdyERoag-iak2lJuQ3TEv6gL57txAGe--VItTvGfkXzjv9tOmPA/exec" placeholder="https://script.google.com/macros/s/..." required>
        </div>

        <hr style="border-color: var(--border); margin: 25px 0;">

        <!-- Message Details -->
        <div class="form-group">
            <label>Update Title / Subject Line</label>
            <input type="text" id="title" placeholder="e.g. New Visual Guide: SD-WAN Architecture 🚀" required>
        </div>

        <div class="form-group">
            <label>Short Description (Body Text)</label>
            <textarea id="desc" rows="4" placeholder="Write a short summary about the new content..." required></textarea>
        </div>

        <div class="form-group">
            <label>Content Deep Link URL (Main Button)</label>
            <input type="url" id="url" placeholder="https://visualnotes.tech/#sd-wan-notes" required>
            <div class="helper">The primary destination where subscribers will be sent.</div>
        </div>

        <!-- V3: Secondary Resource Option -->
        <div class="form-group">
            <label>Secondary Button URL (Optional)</label>
            <input type="url" id="secondaryUrl" placeholder="https://visualnotes.tech/guides/sd-wan.pdf">
        </div>

        <div class="form-group">
            <label>Secondary Button Label (Optional)</label>
            <input type="text" id="secondaryLabel" placeholder="e.g. Download Cheatsheet">
        </div>

        <button onclick="sendBroadcast()" id="sendBtn">🚀 Send to All Subscribers</button>
        <div id="status"></div>
    </div>

    <script>
        // Pre-fill script URL with current deployment URL
        const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwYxzHdMiTy0Q8O-dURdyERoag-iak2lJuQ3TEv6gL57txAGe--VItTvGfkXzjv9tOmPA/exec";
        let savedUrl = localStorage.getItem('vn_script_url');
        if (!savedUrl || savedUrl !== DEFAULT_SCRIPT_URL) {
            savedUrl = DEFAULT_SCRIPT_URL;
            localStorage.setItem('vn_script_url', DEFAULT_SCRIPT_URL);
        }
        document.getElementById('scriptUrl').value = savedUrl;

        const savedKey = localStorage.getItem('vn_admin_key');
        if (savedKey) document.getElementById('adminKey').value = savedKey;

        async function sendBroadcast() {
            const scriptUrl = document.getElementById('scriptUrl').value;
            const adminKey = document.getElementById('adminKey').value;
            const title = document.getElementById('title').value;
            const desc = document.getElementById('desc').value;
            const url = document.getElementById('url').value;
            // V3: Get secondary inputs
            const secondaryUrl = document.getElementById('secondaryUrl') ? document.getElementById('secondaryUrl').value : '';
            const secondaryLabel = document.getElementById('secondaryLabel') ? document.getElementById('secondaryLabel').value : '';

            const status = document.getElementById('status');
            const btn = document.getElementById('sendBtn');

            if (!scriptUrl || !adminKey || !title || !desc || !url) {
                status.style.display = 'block';
                status.innerHTML = '<span style="color: #ff6b6b">Please fill in all required fields</span>';
                return;
            }

            // Save creds for next time
            localStorage.setItem('vn_script_url', scriptUrl);
            localStorage.setItem('vn_admin_key', adminKey);

            btn.disabled = true;
            btn.innerText = "Sending...";
            status.style.display = 'block';
            status.innerText = "Broadcasting to subscribers...";

            try {
                await fetch(scriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        action: 'broadcast',
                        adminKey: adminKey,
                        title: title,
                        description: desc,
                        url: url,
                        secondaryUrl: secondaryUrl,
                        secondaryLabel: secondaryLabel
                    })
                });
                status.style.display = 'block';
                status.innerHTML = '<span style="color: #4ade80">✅ Broadcast queued! Check your Google Sheet logs.</span>';
                document.getElementById('title').value = '';
                document.getElementById('desc').value = '';
                document.getElementById('url').value = '';
                if (document.getElementById('secondaryUrl')) document.getElementById('secondaryUrl').value = '';
                if (document.getElementById('secondaryLabel')) document.getElementById('secondaryLabel').value = '';

            } catch (error) {
                console.error(error);
                status.style.display = 'block';
                status.innerHTML = '<span style="color: #ff6b6b">❌ Network Error: ' + error.message + '</span>';
            }

            btn.disabled = false;
            btn.innerText = "🚀 Send to All Subscribers";
        }
    </script>
</body>

</html>
